[project]
name = "agente-compras"
version = "0.1.0"
description = "Agente que busca en internet el mejor precio y calidad para lo que quieras comprar"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
comprador = "agente_compras.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente_compras"]
