services:
  agente-compras:
    build: .
    # No publicamos puertos en el host: el proxy de Dokploy (Traefik) llega al
    # contenedor por la red interna. Configura el dominio en Dokploy apuntando
    # al puerto 8000 del servicio. Para desarrollo local usa:
    #   docker compose -f docker-compose.yml -f docker-compose.local.yml up
    expose:
      - "8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5}
      # Protege el panel con contraseña (recomendado si es accesible desde internet)
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      # Notificaciones por Telegram (opcional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Límite de gasto: llamadas a la API al día (0 = sin límite)
      - MAX_RUNS_PER_DAY=${MAX_RUNS_PER_DAY:-24}
    volumes:
      - agente_data:/data
    restart: unless-stopped

volumes:
  agente_data:
